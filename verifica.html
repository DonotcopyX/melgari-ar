const s=supabase.createClient('https://kqxcdochhnxulbpjvamp.supabase.co','sb_publishable_aGUxyPy0IiCTyRyHXkXoYw_wWjN6VaL');
(async()=>{const id=new URLSearchParams(location.search).get('id');const box=document.getElementById('c');const {data,error}=await s.from('Coupons').select('*').eq('id',id).single();if(error||!data){box.innerHTML='❌ COUPON NON VALIDO';return;}if(data.usato){box.innerHTML='🔴 COUPON GIÀ UTILIZZATO';return;}box.innerHTML=`✅ COUPON VALIDO<br><br><button id="ok">CONVALIDA</button>`;document.getElementById('ok').onclick=async()=>{const r=await s.from('Coupons').update({usato:true}).eq('id',id);if(r.error){alert(r.error.message);return;}box.innerHTML='✅ COUPON ACCETTATO';};})();
</script></body></html>
