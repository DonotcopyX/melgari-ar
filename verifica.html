<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verifica Coupon Melgari</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:90%;
    max-width:500px;
    text-align:center;
    background:#1b1b1b;
    padding:30px;
    border-radius:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.ok{
    color:#00d26a;
    font-size:40px;
    font-weight:bold;
}

.used{
    color:#ff3b30;
    font-size:40px;
    font-weight:bold;
}

.error{
    color:#ff9900;
    font-size:40px;
    font-weight:bold;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:12px;
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#D4AF37,#B8860B);
    color:#111;
}

.info{
    margin-top:20px;
    line-height:1.8;
}
</style>
</head>
<body>

<div class="card">

    <div id="contenuto">
        Verifica coupon...
    </div>

</div>

<script>

const supabaseClient = supabase.createClient(
    'https://kqxcdochhnxulbpjvamp.supabase.co',
    'sb_publishable_aGUxyPy0IiCTyRyHXkXoYw_wWjN6VaL'
);

const contenuto = document.getElementById('contenuto');

async function verificaCoupon(){

    const params = new URLSearchParams(window.location.search);

    const id = params.get('id');

    if(!id){
        contenuto.innerHTML = `
            <div class="error">⚠</div>
            <h2>ID mancante</h2>
        `;
        return;
    }

    const { data, error } = await supabaseClient
    .from('Coupons')
    .select('*')
    .eq('id', id)
    .single();

    if(error || !data){

        contenuto.innerHTML = `
            <div class="error">❌</div>
            <h2>COUPON NON VALIDO</h2>
        `;

        return;
    }

    if(data.usato){

        contenuto.innerHTML = `
            <div class="used">🔴</div>

            <h2>COUPON GIÀ UTILIZZATO</h2>

            <div class="info">
                <b>Codice:</b><br>
                ${data.codice}<br><br>

                <b>Utilizzato il:</b><br>
                ${data["data-utilizzo"] || "Data non disponibile"}
            </div>
        `;

        return;
    }

    contenuto.innerHTML = `
        <div class="ok">✅</div>

        <h2>COUPON VALIDO</h2>

        <div class="info">
            <b>Nome:</b><br>
            ${data.nome || ""}<br><br>

            <b>Codice:</b><br>
            ${data.codice}
        </div>

        <button id="convalida">
            CONVALIDA COUPON
        </button>
    `;

    document
    .getElementById('convalida')
    .addEventListener('click', async () => {

        const update = await supabaseClient
        .from('Coupons')
        .update({
            usato:true,
            "data-utilizzo": new Date().toISOString()
        })
        .eq('id', id);

        if(update.error){

            alert(update.error.message);

            return;
        }

        contenuto.innerHTML = `
            <div class="ok">✅</div>

            <h2>COUPON ACCETTATO</h2>

            <p>
            Il coupon è stato registrato come utilizzato.
            </p>
        `;
    });
}

verificaCoupon();

</script>

</body>
</html>
