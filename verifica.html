<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifica Coupon Melgari</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:90%;max-width:500px;background:#1b1b1b;padding:30px;border-radius:20px;text-align:center}
button{width:100%;padding:16px;border:none;border-radius:12px;background:#D4AF37;color:#111;font-weight:bold;font-size:18px;cursor:pointer}
.ok{color:#00d26a}.err{color:#ff4d4d}
</style>
</head>
<body>
<div class="card"><div id="contenuto">Verifica...</div></div>
<script>
const supabaseClient=supabase.createClient(
'https://kqxcdochhnxulbpjvamp.supabase.co',
'sb_publishable_aGUxyPy0IiCTyRyHXkXoYw_wWjN6VaL'
);
async function verifica(){
const contenuto=document.getElementById('contenuto');
const id=new URLSearchParams(window.location.search).get('id');
if(!id){contenuto.innerHTML='<h1 class="err">❌</h1><p>ID mancante</p>';return;}
const couponResult=await supabaseClient.from('Coupons').select('*').eq('id',id).single();
if(couponResult.error||!couponResult.data){contenuto.innerHTML='<h1 class="err">❌ Coupon non valido</h1>';return;}
const promoResult=await supabaseClient.from('Promo').select('*').eq('id',1).single();
if(promoResult.error||!promoResult.data){contenuto.innerHTML='<h1 class="err">❌ Errore Promo</h1>';return;}
const countResult=await supabaseClient.from('Coupons').select('*',{count:'exact',head:true}).eq('usato',true);
const coupon=couponResult.data;
const plafond=promoResult.data.plafond;
const erogati=countResult.count||0;
const residui=plafond-erogati;
if(coupon.usato===true){contenuto.innerHTML='<h1 class="err">🔴 COUPON GIÀ UTILIZZATO</h1><p>Erogati: '+erogati+' / '+plafond+'</p><p>Residui: '+residui+'</p>';return;}
if(erogati>=plafond){contenuto.innerHTML='<h1 class="err">⛔ PROMO TERMINATA</h1><p>'+erogati+' / '+plafond+'</p>';return;}
contenuto.innerHTML='<h1 class="ok">✅ COUPON VALIDO</h1><p>Erogati: '+erogati+' / '+plafond+'</p><p>Residui: '+residui+'</p><button id="convalida">CONVALIDA COUPON</button>';
document.getElementById('convalida').onclick=async function(){
const update=await supabaseClient.from('Coupons').update({usato:true}).eq('id',id);
if(update.error){alert(update.error.message);return;}<br>
await fetch(
  "https://api.telegram.org/bot8756647199:AAHbBOSd-7cWk1rBogn_ovUaRWyfvBfE3YQ/sendMessage",
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      chat_id: "1041343623",
      text:
`☕ Nuovo caffè erogato

Codice: ${codice}

Data: ${new Date().toLocaleString('it-IT')}`
    })
  }
);

contenuto.innerHTML='<h1 class="ok">✅ COUPON ACCETTATO</h1><p>Caffè contabilizzato.</p>';
};
}
verifica();
</script>
</body>
</html>
