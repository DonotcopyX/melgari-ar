<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Melgari Caffe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9}
header{background:#0f3d75;color:#fff;padding:20px;text-align:center}
.container{max-width:1200px;margin:auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.value{font-size:34px;font-weight:bold}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:10px;border-bottom:1px solid #ddd} th{background:#0f3d75;color:#fff}
button{padding:10px 16px}
</style>
</head>
<body>
<header><h1>Dashboard Melgari Caffe</h1></header>
<div class="container">
<button onclick="loadData()">Aggiorna</button>
<div class="cards">
<div class="card"><div>Erogati</div><div class="value" id="erogati">0</div></div>
<div class="card"><div>Residui</div><div class="value" id="residui">0</div></div>
<div class="card"><div>Generati</div><div class="value" id="generati">0</div></div>
<div class="card"><div>Rimborso €</div><div class="value" id="totale">0.00</div></div>
</div><br>
<table><thead><tr><th>Data</th><th>Nome</th><th>Email</th><th>Codice</th></tr></thead><tbody id="storico"></tbody></table>
</div>
<script>
const SUPABASE_URL='https://kqxcdochhnxulbpjvamp.supabase.co';
const SUPABASE_KEY='sb_publishable_aGUxyPy0IiCTyRyHXkXoYw_wWjN6VaL';
const { createClient } = supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
async function loadData(){
const {data:promo}=await db.from('Promo').select('*').limit(1).single();
const plafond=(promo&&promo.plafond)||100;
const {count:erogati}=await db.from('Coupons').select('*',{count:'exact',head:true}).eq('usato',true);
const {count:generati}=await db.from('Coupons').select('*',{count:'exact',head:true});
const residui=plafond-(erogati||0);
erogatiEl.textContent=erogati||0;
residuiEl.textContent=residui;
generatiEl.textContent=generati||0;
totale.textContent=((erogati||0)*1.2).toFixed(2);
const {data}=await db.from('Coupons').select('*').eq('usato',true).order('data_utilizzo',{ascending:false}).limit(50);
const tbody=document.getElementById('storico');tbody.innerHTML='';
(data||[]).forEach(r=>tbody.innerHTML+=`<tr><td>${r.data_utilizzo||''}</td><td>${r.nome||''}</td><td>${r.email||''}</td><td>${r.codice||''}</td></tr>`);
}
const erogatiEl=document.getElementById('erogati');
const residuiEl=document.getElementById('residui');
const generatiEl=document.getElementById('generati');
loadData();
</script>
</body></html>
