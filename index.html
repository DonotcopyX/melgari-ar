<!DOCTYPE html><html lang='it'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Melgari AR</title>
<script src='https://aframe.io/releases/1.4.2/aframe.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js'></script>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'></script>
<style>body{margin:0;font-family:Arial}#card1,#card2,#card3{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9999}#card2,#card3{width:90%;max-width:500px;background:#111;color:#fff;padding:30px;border-radius:24px}button{width:100%;padding:16px;margin-top:10px}input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}#qrcode{text-align:center}
#coupon{
    background:#fff;
    color:#111;
    border-radius:30px;
    padding:25px;
    text-align:center;
}

.logo-melgari{
    display:block;
    width:220px;
    max-width:90%;
    margin:0 auto 15px auto;
}

.partner-box{
    background:#f7f7f7;
    border-radius:18px;
    padding:15px;
    margin:20px 0;
}

.partner-label{
    font-size:12px;
    color:#777;
    margin-bottom:10px;
}

.logo-bar{
    width:180px;
    max-width:90%;
    display:block;
    margin:0 auto;
}

#clienteNome{
    font-size:24px;
    font-weight:bold;
    margin:10px 0 20px 0;
}

#codice{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
    margin-top:15px;
}
	.partner-box a{
    text-decoration:none;
    color:inherit;
    display:block;
}

.logo-bar{
    cursor:pointer;
}
</style></head><body>
<div id='card1'><img src='Card1.png' style='max-width:380px;width:70vw'><button id='ricevi-codice'>RICEVI IL TUO CODICE</button></div>
<div id='card2'><h2>☕ Ricevi il tuo caffè omaggio</h2><input id='nome' placeholder='Nome'><input id='email' type='email' placeholder='E-mail'><button id='genera-codice'>OTTIENI IL CODICE</button><div id='debug'></div></div>

	<div id="card3">

    <div id="coupon">

        <img
            src="logo-melgari.png"
            alt="Melgari"
            class="logo-melgari"
            width="200">

        <h2>☕ CAFFÈ OMAGGIO</h2>

        <div class="cliente-label">
            Voucher riservato a
        </div>

        <div id="clienteNome">
            Cliente
        </div>
		
		<div class="partner-box">

    <div class="partner-label">
        Partner convenzionato
    </div>

   <a
    href="https://www.google.com/maps/search/?api=1&query=Caffetteria+al+41"
    target="_blank">
																					<img
        src="logo-bar.png"
        alt="Caffetteria al 41"
        class="logo-bar">
</a>
</div>
		
		
		
		<br>


        <div id="codice"></div>

        <div id="qrcode"></div>

    </div>

    <button id="salvaCoupon">
        SALVA IN GALLERIA
    </button>

    <button id="chiudi">
        CHIUDI
    </button>

</div>
<a-scene device-orientation-permission-ui="enabled:false" mindar-image="imageTargetSrc: targets.mind;" vr-mode-ui="enabled:false"><a-camera></a-camera><a-entity id='target' mindar-image-target='targetIndex:0'></a-entity></a-scene>
<script>
const supabaseClient=supabase.createClient('https://kqxcdochhnxulbpjvamp.supabase.co','sb_publishable_aGUxyPy0IiCTyRyHXkXoYw_wWjN6VaL');
document.getElementById('target').addEventListener('targetFound',()=>{document.getElementById('card1').style.display='block'});
document.getElementById('ricevi-codice').onclick=()=>{document.getElementById('card1').style.display='none';document.getElementById('card2').style.display='block'};
document.getElementById('genera-codice').onclick=async()=>{
	
	try{const nome=document.getElementById('nome').value.trim();const email=document.getElementById('email').value.trim();if(!nome||!email){alert('Compila tutti i campi');return;}const codice='MEL-CAFE-'+Math.random().toString(36).substring(2,8).toUpperCase();const {data,error}=await supabaseClient.from('Coupons').insert([{nome,email,codice,usato:false}]).select();if(error){alert(error.message);return;}document.getElementById('codice').innerText = codice;
document.getElementById('clienteNome').innerText = nome;document.getElementById('qrcode').innerHTML='';
	

document.getElementById('qrcode').innerHTML = '';

const verificaUrl =
  'https://donotcopyx.github.io/melgari-ar/verifica.html?id=' +
  data[0].id;

console.log('QR URL:', verificaUrl);

new QRCode(
  document.getElementById('qrcode'),
  {
    text: verificaUrl,
    width: 260,
    height: 260
  }
);

document.getElementById('card2').style.display = 'none';
document.getElementById('card3').style.display = 'block';

		   
		   
		   
		   {text:'https://donotcopyx.github.io/melgari-ar/verifica.html?id='+data[0].id,width:260,height:260});document.getElementById('card2').style.display='none';document.getElementById('card3').style.display='block';}catch(e){alert(e.message)}};
document.getElementById('salvaCoupon').onclick=async()=>{const c=await html2canvas(document.getElementById('coupon'));const a=document.createElement('a');a.download='coupon-melgari.png';a.href=c.toDataURL();a.click();};
document.getElementById('chiudi').onclick=()=>{document.getElementById('card3').style.display='none'};
</script></body></html>
