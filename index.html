<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melgari AR</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;}
#coupon-card{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;max-width:420px;background:#111;color:#fff;padding:30px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:9999;text-align:center;}
#coupon-card h2{color:#d4af37;margin-top:0;}
#coupon-card input{width:100%;padding:12px;margin-bottom:12px;border:none;border-radius:8px;box-sizing:border-box;}
#coupon-card button{width:100%;background:#d4af37;border:none;padding:14px;border-radius:10px;font-weight:bold;cursor:pointer;}
#close{position:absolute;top:10px;right:15px;cursor:pointer;font-size:22px;}
</style>
</head>
<body>

<br>
<div id="card1" style="
display:none;
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:500px;
z-index:9999;
">

<img
src="Melgari_AR_Card/Card1.png"
style="
width:100%;
border-radius:20px;
display:block;
">

<button
id="ricevi-codice"
style="
position:absolute;
adient(135deg,#D4AF37,#B8860B);
color:#111;
border:none;
padding:16px 28px;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
">
RICEVI IL TUO CODICE
</button>

</div>

	<div id="card2" style="
display:none;
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:700px;
background:rgba(10,10,10,0.97);
color:white;
padding:40px;
border-radius:24px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.5);
z-index:9999;
font-family:Arial,sans-serif;
">

    <h2 style="
    color:#D4AF37;
    font-size:42px;
    font-weight:300;
    margin-bottom:10px;
    ">
        ☕
    </h2>

    <h3 style="
    font-size:34px;
    font-weight:300;
    margin-bottom:15px;
    ">
        Ricevi il tuo caffè omaggio
    </h3>

    <p style="
    color:#dddddd;
    font-size:20px;
    margin-bottom:30px;
    ">
        Inserisci i tuoi dati per ottenere il codice univoco.
    </p>

    <input
    id="nome"
    type="text"
    placeholder="Nome"
    style="
    width:100%;
    padding:16px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    box-sizing:border-box;
    ">

    <input
    id="email"
    type="email"
    placeholder="E-mail"
    style="
    width:100%;
    padding:16px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
    font-size:18px;
    box-sizing:border-box;
    ">

    <label style="
    display:block;
    margin-bottom:25px;
    color:#cccccc;
    font-size:14px;
    text-align:left;
    ">
        <input
        id="privacy"
        type="checkbox">
        Acconsento al trattamento dei dati personali.
    </label>

    <button
    id="genera-codice"
    style="
    background:linear-gradient(135deg,#D4AF37,#B8860B);
    color:#111;
    border:none;
    padding:18px 40px;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    width:100%;
    ">
        OTTIENI IL CODICE
    </button>

</div>
	
	
	
	<script>
document
.getElementById("ricevi-codice")
.addEventListener("click", function(){

    document.getElementById("card1").style.display = "none";
    document.getElementById("card2").style.display = "block";

});
</script>

<a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0">
<a-plane position="0 0 0" width="1.8" height="1" opacity="0.95" color="#111111"></a-plane>
<a-text value="☕" align="center" color="#D4AF37" position="0 0.30 0.01" width="3"></a-text>
<a-text value="Hai aperto una finestra con noi" align="center" color="#FFFFFF" position="0 0.10 0.01" width="3"></a-text>
<a-text value="Caffe omaggio" align="center" color="#D4AF37" position="0 -0.10 0.01" width="3"></a-text>
<a-text value="Compila il modulo" align="center" color="#FFFFFF" position="0 -0.30 0.01" width="2"></a-text>
</a-entity>
</a-scene>
<script>
const target = document.querySelector('#target');

target.addEventListener('targetFound', () => {
    document.getElementById('card1').style.display = 'block';
});

document
.getElementById('ricevi-codice')
.addEventListener('click', () => {

    document.getElementById('card1').style.display = 'none';
    document.getElementById('card2').style.display = 'block';

});
</script>
</body>
</html>
