<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Melgari AR</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
body{margin:0;overflow:hidden;font-family:Arial,sans-serif}
#card1,#card2{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9999}
#card1 img{width:90vw;max-width:500px;border-radius:20px}
#card2{width:90%;max-width:500px;background:#111;color:#fff;padding:30px;border-radius:20px}
input,button{width:100%;padding:14px;box-sizing:border-box;margin-top:10px}
button{background:#D4AF37;border:none;font-weight:bold}
</style></head>
<body>
<div id="card1">
<img src="Card1.png" alt="Card 1">
<button id="ricevi-codice">RICEVI IL TUO CODICE</button>
</div>
<div id="card2">
<h2>☕ Ricevi il tuo caffè omaggio</h2>
<input type="text" placeholder="Nome">
<input type="email" placeholder="E-mail">
<button id="genera-codice">OTTIENI IL CODICE</button>
</div>
<a-scene mindar-image="imageTargetSrc: targets.mind;" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0"></a-entity>
</a-scene>
<script>
const target=document.querySelector('#target');
target.addEventListener('targetFound',()=>document.getElementById('card1').style.display='block');
document.getElementById('ricevi-codice').onclick=()=>{card1.style.display='none';card2.style.display='block';};
document.getElementById('genera-codice').onclick=()=>alert('MEL-CAFE-'+Math.floor(1000+Math.random()*9000));
</script></body></html>
