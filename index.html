<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Melgari AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
<div id="coupon-card" style="
display:none;
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:420px;
background:#111;
color:white;
padding:30px;
border-radius:20px;
font-family:Arial,sans-serif;
text-align:center;
z-index:9999;
">

<h2>☕ Hai aperto una finestra con noi</h2>

<p>Ricevi il codice del tuo caffè omaggio</p>

<input
type="text"
placeholder="Nome"
style="width:100%;padding:12px;margin-bottom:10px;">

<input
type="email"
placeholder="E-mail"
style="width:100%;padding:12px;margin-bottom:15px;">

<button
style="
background:#D4AF37;
border:none;
padding:14px 24px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
">
OTTIENI IL CODICE
</button>

</div>
<a-scene
  mindar-image="imageTargetSrc: targets.mind;"
  color-space="sRGB"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0">

  <a-plane
    position="0 0 0"
    width="1.8"
    height="1.1"
    color="#111111"
    opacity="0.95">
  </a-plane>

  <a-text
    value="☕"
    align="center"
    color="#D4AF37"
    position="0 0.35 0.01"
    width="2">
  </a-text>

  <a-text
    value="Hai aperto una finestra con noi"
    align="center"
    color="#FFFFFF"
    position="0 0.15 0.01"
    width="3">
  </a-text>

  <a-text
    value="Ricevi il codice del tuo caffe omaggio"
    align="center"
    color="#DDDDDD"
    position="0 -0.05 0.01"
    width="2.5">
  </a-text>

  <a-text
    value="Inserisci Nome ed E-mail"
    align="center"
    color="#D4AF37"
    position="0 -0.28 0.01"
    width="2">
  </a-text>

</a-entity>

</a-scene>

</body>
</html>
